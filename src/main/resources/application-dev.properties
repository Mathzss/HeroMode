# Local development only. Activate with SPRING_PROFILES_ACTIVE=dev.
# Never set this profile on heromode.com.br: it puts exception messages,
# binding errors and SQL into responses and logs.

# Show error details in API responses so the frontend can display them
# and we can debug 500s from outside.
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-exception=true
server.error.include-stacktrace=always

# Verbose logging for security + JPA while we are debugging.
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.example.heromode=DEBUG
