spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Profile: production is the default on purpose. Local development has to ask
# for the verbose profile explicitly (SPRING_PROFILES_ACTIVE=dev); forgetting
# the variable in production must never fall back to the debug settings.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

# Safe defaults for every profile. Nothing internal leaves the server here:
# error details come from GlobalExceptionHandler, which decides case by case
# what the client may see. application-dev.properties relaxes this locally.
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

logging.level.root=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.com.example.heromode=INFO
